name: barracuda package checks

on:
  push:
    branches: [pypackage]
    paths:
      - "pyproject.toml"
      - "README.md"
      - "PACKAGE_README.md"
      - "CITATION.cff"
      - "MANIFEST.in"
      - "mkdocs.yml"
      - "docs/**"
      - "src/barracuda/**"
      - "tests/**"
      - ".github/workflows/python-package.yml"
      - ".github/workflows/publish-package.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "pyproject.toml"
      - "README.md"
      - "PACKAGE_README.md"
      - "CITATION.cff"
      - "MANIFEST.in"
      - "mkdocs.yml"
      - "docs/**"
      - "src/barracuda/**"
      - "tests/**"
      - ".github/workflows/python-package.yml"
      - ".github/workflows/publish-package.yml"
      - ".github/workflows/docs.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test,build]"
      - name: Run package tests
        run: python -m pytest -q
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distributions
        run: python -m twine check dist/*
      - name: Test wheel in a clean environment
        run: |
          python -m venv /tmp/barracuda-wheel-test
          /tmp/barracuda-wheel-test/bin/python -m pip install dist/*.whl
          /tmp/barracuda-wheel-test/bin/python -c "import barracuda; from barracuda import diagnostics, donors, evidence, io, plotting, scans, validation; print(barracuda.__version__)"
