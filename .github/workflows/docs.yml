name: barracuda documentation

on:
  push:
    branches: [pypackage]
    paths:
      - "mkdocs.yml"
      - "docs/**"
      - "README.md"
      - "pyproject.toml"
      - "src/barracuda/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "mkdocs.yml"
      - "docs/**"
      - "README.md"
      - "pyproject.toml"
      - "src/barracuda/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and documentation tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[docs]"
      - name: Build strict documentation
        run: python -m mkdocs build --strict
      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/pypackage'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/pypackage'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/pypackage'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
