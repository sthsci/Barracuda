[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bayesorca"
version = "0.1.0"
description = "Bayesian inference for heterogeneity in immune cell event counts and decision trajectories"
readme = "PACKAGE_README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [
  { name = "Elephes Sung" },
  { name = "Cathal Hosty" },
  { name = "Leanne Peiser" },
  { name = "Lara Stepan" },
  { name = "Daniel M Davis" },
  { name = "Ruben Perez-Carrasco" },
]
keywords = [
  "Bayesian inference",
  "PyMC",
  "single-cell",
  "cytotoxicity",
  "model comparison",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "arviz==0.22.0",
  "h5py==3.13.0",
  "numpy==1.26.4",
  "pandas==2.2.3",
  "pymc==5.25.1",
  "pytensor==2.31.7",
  "scipy==1.14.1",
  "xarray==2025.1.1",
]

[project.optional-dependencies]
test = ["pytest==8.3.4"]
build = ["build>=1.2", "twine>=5.1"]

[project.urls]
Homepage = "https://github.com/sthsci/Orca"
Repository = "https://github.com/sthsci/Orca"
Issues = "https://github.com/sthsci/Orca/issues"

[tool.setuptools]
packages = [
  "bayesorca",
  "bayesorca._backends",
  "bayesorca._backends.event_counts",
  "bayesorca._backends.donor",
  "bayesorca._backends.trajectories",
  "bayesorca._core",
]

[tool.setuptools.package-dir]
"bayesorca" = "src/bayesorca"
"bayesorca._backends" = "src/bayesorca/_backends"
"bayesorca._backends.event_counts" = "section_1/src"
"bayesorca._backends.donor" = "section_2/src"
"bayesorca._backends.trajectories" = "section_3/src"
"bayesorca._core" = "webapp/core"

[tool.setuptools.package-data]
bayesorca = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
