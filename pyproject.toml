[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "barracuda"
version = "0.2.0"
description = "Bayesian Analysis Resolving Randomness and Alternative Causes Underlying Differential Activity"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Elephes Sung" },
  { name = "Cathal Hosty" },
  { name = "Leanne Peiser" },
  { name = "Lara Stepan" },
  { name = "Daniel M Davis" },
  { name = "Ruben Perez-Carrasco" },
]
keywords = [
  "Bayesian inference",
  "PyMC",
  "single-cell",
  "cytotoxicity",
  "model comparison",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "arviz==0.22.0",
  "h5py==3.13.0",
  "matplotlib==3.9.3",
  "numpy==1.26.4",
  "pandas==2.2.3",
  "pymc==5.25.1",
  "pytensor==2.31.7",
  "scipy==1.14.1",
  "xarray==2025.1.1",
]

[project.optional-dependencies]
test = ["pytest==8.3.4"]
build = ["build>=1.2", "twine>=5.1"]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5,<10",
  "mkdocstrings[python]>=0.27,<1",
]

[project.urls]
Homepage = "https://github.com/sthsci/Barracuda"
Documentation = "https://sthsci.github.io/Barracuda/"
Repository = "https://github.com/sthsci/Barracuda"
Issues = "https://github.com/sthsci/Barracuda/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["barracuda*"]

[tool.setuptools.package-data]
barracuda = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
