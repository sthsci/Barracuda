site_name: BARRACUDA
site_description: Bayesian Analysis Resolving Randomness and Alternative Causes Underlying Differential Activity.
site_url: https://sthsci.github.io/Barracuda/
repo_url: https://github.com/sthsci/Barracuda
repo_name: sthsci/Barracuda
edit_uri: edit/pypackage/docs/
copyright: Copyright &copy; the BARRACUDA authors. Released under the MIT License.

strict: true

theme:
  name: material
  language: en
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts:
      - Model catalog: concepts/model-catalog.md
      - Evidence and Bayes factors: concepts/evidence.md
  - Guides:
      - Event counts: guides/event-counts.md
      - Donor-aware models: guides/donor-aware.md
      - Ordered trajectories: guides/trajectories.md
      - Scientific validation: guides/validation.md
      - Bayes-factor scans: guides/bayes-factor-scans.md
      - Plotting and diagnostics: guides/plotting-diagnostics.md
  - Reference:
      - Input schemas: reference/input-schemas.md
      - Settings, results, and errors: reference/settings-results-errors.md
      - Reproducibility and privacy: reproducibility.md
      - API:
          - Overview: api/index.md
          - Event counts: api/event-counts.md
          - Trajectories: api/trajectories.md
          - Donor utilities: api/donors.md
          - Evidence: api/evidence.md
          - Validation: api/validation.md
          - Scan runners: api/scans.md
          - Diagnostics: api/diagnostics.md
          - Plotting: api/plotting.md
          - Persistence: api/io.md
          - Progress: api/progress.md
  - Development: development.md
  - Changelog: changelog.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            heading_level: 2
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_category_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            show_source: false
            signature_crossrefs: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sthsci/Barracuda
      name: BARRACUDA on GitHub
